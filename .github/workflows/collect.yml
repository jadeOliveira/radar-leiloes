name: Coleta diária de leilões

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 em Brasília (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar coletor
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Coletar anúncios públicos
        run: python scripts/collect_zuk.py
      - name: Registrar atualização dos dados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/auctions.json
          if git diff --cached --quiet; then
            echo 'Sem alterações nos dados coletados.'
          else
            git commit -m 'data: refresh auction listings'
            git push
          fi
