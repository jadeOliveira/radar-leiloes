name: Coleta diária de leilões

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar coletor
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Testar parsing e classificação
        run: python -m unittest discover -s tests -v
      - name: Coletar anúncios públicos
        id: collect
        run: python -m monitor.run
      - name: Registrar atualização dos dados
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/properties.json data/history.json data/changes.json data/last-run.json
          if git diff --cached --quiet; then
            echo 'Sem alterações nos dados coletados.'
          else
            git commit -m 'data: update auction monitor records'
            git push
          fi
