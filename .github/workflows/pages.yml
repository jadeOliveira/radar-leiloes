name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Coleta diária de leilões"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirmar gatilho da coleta
        if: github.event_name == 'workflow_run'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          trigger = json.loads(Path('data/collection-trigger.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'run_id': trigger.get('run_id'),
              'trigger': trigger.get('trigger'),
              'collection_outcome': trigger.get('collection_outcome'),
              'finished_at': trigger.get('finished_at'),
          }, ensure_ascii=False))
          PY
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm ci
      - name: Validar fotos disponíveis; usar placeholder quando a fonte não tiver foto verificável
        run: python -m monitor.photo_policy
      - name: Compilar painel
        run: |
          mkdir -p public/data
          cp data/properties.json public/data/properties.json
          cp data/last-run.json public/data/last-run.json
          cp data/changes.json public/data/changes.json
          npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
